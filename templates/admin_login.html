<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Administration — CoeurSteam</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;

        background:
            radial-gradient(circle at top, rgba(255, 193, 7, 0.08), transparent 35%),
            #080808;

        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .admin-container {
        width: 100%;
        max-width: 430px;
        padding: 20px;
    }

    .admin-box {
        background: rgba(18, 18, 18, 0.96);
        border: 1px solid rgba(255, 193, 7, 0.35);
        border-radius: 18px;
        padding: 42px 35px;

        text-align: center;

        box-shadow:
            0 0 35px rgba(255, 193, 7, 0.08),
            0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .crown {
        font-size: 42px;
        margin-bottom: 12px;
    }

    h1 {
        margin: 0;
        color: #ffc107;
        font-size: 28px;
        letter-spacing: 1px;
    }

    .subtitle {
        margin-top: 10px;
        color: #999;
        font-size: 14px;
    }

    .warning {
        margin: 28px 0;
        padding: 16px;

        background: rgba(255, 193, 7, 0.06);
        border: 1px solid rgba(255, 193, 7, 0.22);
        border-radius: 12px;

        color: #d0d0d0;
        font-size: 13px;
        line-height: 1.6;
    }

    .warning strong {
        color: #ffc107;
    }

    input {
        width: 100%;
        padding: 14px 16px;

        background: #0d0d0d;
        border: 1px solid #333;
        border-radius: 10px;

        color: white;
        font-size: 14px;

        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #ffc107;
        box-shadow: 0 0 12px rgba(255, 193, 7, 0.12);
    }

    button {
        width: 100%;
        margin-top: 16px;
        padding: 14px;

        background: linear-gradient(135deg, #ffc107, #d99f00);
        border: none;
        border-radius: 10px;

        color: #111;
        font-size: 15px;
        font-weight: bold;

        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 25px rgba(255, 193, 7, 0.18);
    }

    .footer {
        margin-top: 25px;
        color: #555;
        font-size: 11px;
        letter-spacing: 0.5px;
    }

    .owner {
        color: #ffc107;
    }
</style>


</head>

<body>


<div class="admin-container">

    <div class="admin-box">

        <div class="crown">♛</div>

        <h1>ESPACE ADMINISTRATION</h1>

        <div class="subtitle">
            Accès sécurisé — CoeurSteam
        </div>

        <div class="warning">
            ⚠️ <strong>Espace strictement réservé au propriétaire du site.</strong>
            <br>
            Cet espace permet de gérer les commandes et les discussions clients.
            Toute tentative d'accès non autorisée est interdite.
        </div>

        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="Mot de passe administrateur"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                SE CONNECTER
            </button>

        </form>

        <div class="footer">
            DÉVELOPPÉ PAR <span class="owner">CORRAZ0N</span>
        </div>

    </div>

</div>


</body>
</html>
